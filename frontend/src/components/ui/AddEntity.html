<div id="add-entity-overlay" class="popup-overlay"
     onclick="closePopupea()"></div>

<div id="add-entity-popup" class="popup-d paddin bg-sec">
    <h1>Add entity</h1>
    <button class="btn" onclick="addentity('Empty Entity');closePopupea();">
        <h1>Empty entity</h1>
    </button>
</div>

<style>
.popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
}
.popup-d {
    position: fixed;
    bottom: -1px;
    left: 0;
    width: 100%;
    height: 80vh;
    border-radius: 20px 20px 0 0;
    z-index: 1000;
    transform: translateY(100%);
    transition: transform 0.3s ease;
}
.popup-d.active {
    transform: translateY(0);
}
</style>

<script>
function openPopupea() {
    document.getElementById('add-entity-popup')
        .classList.add('active');

    document.getElementById('add-entity-overlay')
        .style.display = 'block';
}

function closePopupea() {
    document.getElementById('add-entity-popup')
        .classList.remove('active');

    document.getElementById('add-entity-overlay')
        .style.display = 'none';
}
</script>
