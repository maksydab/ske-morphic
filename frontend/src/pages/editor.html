<script>
  const classes = ["panel-de", "panel-vc", "panel-play"];

  function switcharoo(i) {
    for (let j = 0; j < classes.length; j++) {
      const panel = document.querySelector("." + classes[j]);

      if (j === i) {
        panel.className = classes[j] + " block";
      } else {
        panel.className = classes[j] + " hide";
      }
    }
  }
</script>
